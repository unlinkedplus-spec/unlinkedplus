global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: unlinked-api
    static_configs:
      - targets: ["backend:3001"]
    metrics_path: /metrics

  - job_name: unlinked-nginx
    static_configs:
      - targets: ["nginx:80"]

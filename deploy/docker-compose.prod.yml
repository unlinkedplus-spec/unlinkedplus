# Overlay VPS — menambahkan observability ke compose dasar.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Compose dasar tetap memakai 1 backend + 1 worker dan total <2 GB. Overlay ini
# hanya menambah Prometheus/Grafana untuk VPS; tidak ada file konfigurasi yang
# hilang dan healthcheck memakai endpoint /health yang benar-benar tersedia.
#
# Skala horizontal backend/worker sengaja tidak diaktifkan di sini: rute live
# /api di host nginx mengarah ke 127.0.0.1:3001, jadi backend harus tetap satu
# instance kecuali host nginx diubah untuk memakai nginx internal (:8080).

services:
  backend:
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
    mem_limit: 384m

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
    mem_limit: 256m

volumes:
  prometheus_data:
  grafana_data:

server {
  listen 80;
  server_name _;
  root /var/www/unlinked-plus;
  index index.html;
  charset utf-8;
  server_tokens off;

  location ~ /\. { return 404; }
  location ^~ /apps/ { return 404; }
  location ^~ /docker/ { return 404; }
  location ^~ /storage/ { return 404; }
  location ~* \.(yml|yaml|json|ts|tsx|md|sql|toml|cjs|gz)$ { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location ~* \.(css|js|png|jpg|gif|svg|ico|woff|woff2)$ {
    expires 1d;
    add_header Cache-Control "public";
  }
  gzip on;
  gzip_types text/html text/css application/javascript application/json;
}

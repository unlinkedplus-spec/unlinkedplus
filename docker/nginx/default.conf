# Snippet conf.d untuk Nginx lapisan aplikasi (dipasang di /etc/nginx/conf.d).
#
# Perubahan dibanding versi lama:
#   1. resolver 127.0.0.11 + proxy_pass variabel -> replica backend/frontend
#      baru langsung terpakai tanpa reload Nginx (syarat horizontal scaling).
#   2. limit_req per IP -> menyerap flood sebelum menyentuh Node.js
#      (pertahanan lapis kedua setelah RateLimitGuard di API).
#   3. X-Forwarded-For memakai $proxy_add_x_forwarded_for (versi lama
#      memakai $http_x_real_ip yang bisa dipalsukan klien).
#   4. /metrics tidak dapat diakses dari luar.
#
# Catatan: `limit_req_zone` sah di sini karena file conf.d di-include pada
# konteks `http`.

limit_req_zone  $binary_remote_addr zone=unl_read:10m  rate=60r/s;
limit_req_zone  $binary_remote_addr zone=unl_write:10m rate=5r/s;
limit_req_zone  $binary_remote_addr zone=unl_auth:10m  rate=2r/s;
limit_conn_zone $binary_remote_addr zone=unl_conn:10m;

server {
  listen 80;
  server_tokens off;
  client_max_body_size 16k;
  client_body_timeout 10s;

  # DNS internal Docker: instance baru terdeteksi dalam <=10 detik.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Variabel memaksa Nginx memakai resolver (bukan cache saat startup).
  set $backend_upstream  "backend:3001";
  set $frontend_upstream "frontend:3000";

  location ~ /\. {
    deny all;
    return 404;
  }

  # Metrik Prometheus hanya untuk jaringan internal.
  location = /api/metrics {
    return 404;
  }

  # Health check dipakai healthcheck container.
  location = /api/health {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_upstream;
    access_log off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # Auth: limit paling ketat (anti brute force).
  location ~ ^/api/auth/(login|register)$ {
    limit_req zone=unl_auth burst=5 nodelay;
    limit_req_status 429;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API: limit sedang. `rewrite ... break` menggantikan trailing-slash pada
  # proxy_pass lama (proxy_pass variabel tidak melakukan prefix replacement).
  location /api/ {
    limit_req zone=unl_write burst=20 nodelay;
    limit_req_status 429;
    limit_conn unl_conn 64;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  # Frontend Next.js.
  location / {
    limit_req zone=unl_read burst=120 nodelay;
    limit_req_status 429;
    limit_conn unl_conn 64;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  error_page 429 = @too_many;
  location @too_many {
    default_type application/json;
    return 429 '{"statusCode":429,"message":"Terlalu banyak permintaan"}';
  }
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 16M;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # SEC-03: CSP with a per-request nonce is now emitted by apps/web/src/middleware.ts.
  # Do not re-add a static CSP here — duplicate policies would intersect and
  # reintroduce 'unsafe-inline' requirements. Static-only assets get a strict
  # policy in their own location block below.

  location ~ /\. { return 404; }

  location = /api/metrics { return 404; }
  location /docs/         { return 404; }

  # Next.js assets MUST reach the frontend container. Previously they fell
  # through to the static landing page and were served as text/html.
  location ^~ /_next/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Routed Next.js pages (do not match /app.html — that stays static).
  location ~ ^/app(/|$) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Admin panel (Next.js) — includes /admin/dashboard.
  location ~ ^/admin(/|$) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Preview of the two-state Beranda (does not replace the public root yet).
  location = /preview {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Proxy API requests to backend. Prefix /api is stripped.
  location /api {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Legacy static assets stay on disk (landing mockup art, styles, scripts).
  location ~ ^/(styles|js|images|fonts)/ {
    root /var/www/unlinked-plus;
    expires 1d;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self';" always;
  }

  # Public root is served by Next.js: cookie decides Chibi (public) or
  # Same Boat (logged-in Beranda). Both are pixel-faithful to the mockups.
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
